services:
  - type: web
    name: buildbridge
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: OPENROUTER_DEFAULT_PLANNER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_DEFAULT_BUILDER_MODEL
        value: deepseek/deepseek-chat
